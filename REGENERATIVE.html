<script>
  function toggleBlock(id){var body=document.getElementById('result-'+id);var btn=event.target;if(body.style.display==='none'){body.style.display='block';btn.textContent='閉じる';}else{body.style.display='none';btn.textContent='詳しく見る→';}var blocks=['insight','action','evidence','recipe'];blocks.forEach(function(b){if(b!==id){var el=document.getElementById('result-'+b);if(el&&el.style.display!=='none'){el.style.display='none';var sib=el.previousElementSibling;if(sib&&sib.tagName==='BUTTON'){sib.textContent='詳しく見る→';}}}});}
function getSeason(month){
  if(month>=2&&month<=4)return '春';
  if(month>=5&&month<=7)return '夏';
  if(month>=8&&month<=10)return '秋';
  return '冬';
}
function getTimeOfDay(hour){
  if(hour>=5&&hour<10)return '朝';
  if(hour>=10&&hour<14)return '昼';
  if(hour>=14&&hour<18)return '午後';
  if(hour>=18&&hour<22)return '夜';
  return '深夜';
}
  function getMoonPhase(){
  var now=new Date();
  var known=new Date(2000,0,6);
  var diff=now-known;
  var days=diff/(1000*60*60*24);
  var phase=days%29.53;
  if(phase<0)phase+=29.53;
  if(phase<1.85)return{name:'NEW MOON',svg:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/>'};
  if(phase<7.38)return{name:'WAXING',svg:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><path d="M11,1 A10,10 0 0,1 11,21 A5,10 0 0,0 11,1" fill="#8a6a12"/>'};
  if(phase<14.77)return{name:'FULL MOON',svg:'<circle cx="11" cy="11" r="10" fill="#8a6a12"/>'};
  if(phase<22.15)return{name:'WANING',svg:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><path d="M11,1 A10,10 0 0,0 11,21 A5,10 0 0,1 11,1" fill="#8a6a12"/>'};
  return{name:'NEW MOON',svg:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/>'};
}
  function getElement(){var now=new Date();var day=now.getDate();var elements=[{name:'WOOD',msg:['新しい芽吹きを、身体の奥に感じて','静かな力が、内側にある','やわらかく、しなやかに伸びる']},{name:'FIRE',msg:['内なる熱を、静かに燃やす','光は、内側から生まれる','火のように、前へ向かう']},{name:'EARTH',msg:['地に足をつけ、内側を満たす','自分の中に、戻れる場所がある','大地に還る、ただそこにいる']},{name:'METAL',msg:['研ぎ澄まされた感覚で、今日を','手放すほど、本質が見えてくる','静けさの中に、輝きが宿る']},{name:'WATER',msg:['流れに委ねる、静かな循環を','深く、静かに、身体が満ちる','滞りが、静かにほどけていく']}];var el=elements[day%5];var msg=el.msg[day%3];return{name:el.name,msg:msg};}
  function getElementSvg(name){var svgs={WOOD:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><line x1="11" y1="17" x2="11" y2="6" stroke="#8a6a12" stroke-width="1.6"/><line x1="11" y1="10" x2="7" y2="7" stroke="#8a6a12" stroke-width="1.6"/><line x1="11" y1="13" x2="15" y2="10" stroke="#8a6a12" stroke-width="1.6"/>',FIRE:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><polygon points="11,5 17,17 5,17" fill="#8a6a12"/>',EARTH:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><rect x="5" y="11" width="12" height="7" fill="#8a6a12"/><polygon points="5,11 11,5 17,11" fill="#8a6a12"/>',METAL:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><polygon points="11,4 18,11 11,18 4,11" fill="#8a6a12"/>',WATER:'<circle cx="11" cy="11" r="10" fill="none" stroke="#8a6a12" stroke-width="1.4"/><path d="M4,13 Q7,8 11,13 Q15,18 18,13" fill="#8a6a12"/><path d="M4,9 Q7,4 11,9 Q15,14 18,9" fill="#8a6a12"/>'}; return svgs[name]||'';}
  var state={q1:null,q2:null,q3:null,q4:null,q5:null};
var q3Map={
  '姿勢・コンディション':{title:'どの部位に意識を向けますか？',opts:[{v:'首・頭まわり（こりや重さ）',m:'首・頭まわり',s:'こりや重さを感じる'},{v:'肩・肩甲骨（緊張や動かしにくさ）',m:'肩・肩甲骨',s:'緊張や動かしにくさ'},{v:'腰まわり（張りや違和感）',m:'腰まわり',s:'張りや違和感'},{v:'姿勢バランス（背中・骨盤）',m:'姿勢バランス',s:'背中・骨盤の整い'}]},

  'ボディメイク・ダイエット':{title:'どのラインを整えたいですか？',opts:[{v:'ヒップ（引き上げ・安定）',m:'ヒップ',s:'引き上げ・安定'},{v:'ウエスト（くびれ・ライン）',m:'ウエスト',s:'くびれ・ライン'},{v:'二の腕（引き締め）',m:'二の腕',s:'引き締め'},{v:'全身バランス（体脂肪・シルエット）',m:'全身バランス',s:'体脂肪・シルエット'}]},
  'メンタル':{title:'今の状態に近いものは？',opts:[{v:'ストレスを感じる（緊張や負担）',m:'ストレスを感じる',s:'緊張や負担'},{v:'疲れが抜けにくい（回復しにくい）',m:'疲れが抜けにくい',s:'回復しにくい'},{v:'集中しにくい（思考の乱れ）',m:'集中しにくい',s:'思考の乱れ'},{v:'睡眠の質が低い（休息の浅さ）',m:'睡眠の質が低い',s:'休息の浅さ'}]}
};

function goTo(s){
  document.querySelectorAll('.screen').forEach(function(x){x.classList.remove('active');});
  document.getElementById('screen-'+s).classList.add('active');
  if(s==='q3')buildQ3();
}

function selectQ(q,val,el){
  state[q]=val;
  if(q==='q1')state.q3=null;
  el.closest('.q-options').querySelectorAll('.q-option').forEach(function(b){b.classList.remove('selected');});
  el.classList.add('selected');
  var btn=document.getElementById('btn-'+q+'-next');
  if(btn){btn.style.opacity='1';btn.style.pointerEvents='auto';}
setTimeout(function(){if(q==='q1')goTo('q2');else if(q==='q2')goTo('q3');else if(q==='q3')goTo('q5');else if(q==='q5')goToResult();},400);}

function buildQ3(){
  var d=q3Map[state.q1];
  if(!d)return;
  document.getElementById('q3-title').textContent=d.title;
  var c=document.getElementById('q3-options');
  c.innerHTML='';

  
  state.q3=null;
  d.opts.forEach(function(opt){
    var el=document.createElement('button');
    el.className='q-option';
    el.innerHTML='<span class="opt-main">'+opt.m+'</span><span class="opt-sub">'+opt.s+'</span>';
    el.onclick=function(){selectQ('q3',opt.v,el);};
    c.appendChild(el);
  });
}

function goToResult(){
  goTo('loading');
  generateResult();
}

  try {
